<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="sesion.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Papulandia</title>
</head>
<body>

    <div class="estrellas">
        <div class="estrella"></div>
        <div class="estrella"></div>
        <div class="estrella"></div>
        <div class="estrella"></div>
        <div class="estrella"></div>
        <div class="estrella"></div>
        <div class="estrella"></div>
        <div class="estrella"></div>
    </div>

    <div class="login-wrapper">
        <form class="login-card" action="">
            <div class="login-icono">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>

            <h2 class="login-titulo">Bienvenido de nuevo</h2>

            <div class="campo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="12" cy="8" r="3.2"/>
                    <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
                </svg>
                <input type="text" placeholder="Usuario" required>
            </div>

            <div class="campo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="3" y="6" width="18" height="13" rx="2"/>
                    <path d="M3 7l9 6 9-6"/>
                </svg>
                <input type="email" placeholder="Correo" name="email" required>
            </div>

            <div class="campo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="4" y="10" width="16" height="10" rx="2"/>
                    <path d="M8 10V7a4 4 0 018 0v3"/>
                </svg>
                <input type="password" placeholder="Contraseña" name="password" required>
            </div>

            <div class="login-opciones">
                <label class="recordarme">
                    <input type="checkbox">
                    Recordarme
                </label>
                <a href="#" class="olvide">¿Olvidaste tu contraseña?</a>
            </div>

            <input type="submit" value="Iniciar sesión" class="boton-login">
        </form>
    </div>

    <script type="module" src="login.js"></script>

</body>
</html>
